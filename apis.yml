aid: bcb-group
name: BCB Group
description: >-
  BCB Group is a regulated, multi-jurisdictional payments infrastructure provider connecting
  traditional finance with digital assets for financial institutions across global fiat and crypto
  markets. Its products include multi-currency payment accounts, virtual IBANs, crypto and e-money
  accounts, trading, stablecoin earn, and the BLINC instant, fee-free 24/7 settlement network linking
  100+ ecosystem members. BCB serves 250+ clients (including Bitstamp, Circle, Ripple, Fireblocks and
  Copper) and exposes a Bearer-token Payments API (OAuth 2.0 client credentials) covering accounts,
  balances, transactions, beneficiaries, payments, virtual accounts and webhooks. Surfaced as a
  portfolio company of Pantera Capital and enriched from its public developer documentation.
