                    notes: null
                    source_name: clearbank
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '401':
          description: Unauthorized
          content:
            text/html:
              schema:
                type: string
                example: Invalid token
        '403':
          description: Forbidden
          content:
            text/html:
              schema:
                type: string
                example: Forbidden
        '404':
          description: Not Found
          content:
            text/html:
              schema:
                type: string
                example: Not Found
        '500':
          description: Internal Server Error
          content:
            text/html:
              schema:
                type: string
                example: Internal Server Error
      parameters:
      - name: accountId
        in: path
        required: true
        description: The account id
        schema:
          example: 123
          type: integer
          default: ''
      - name: dateFrom
        in: query
        required: false
        description: The date to get results from
        schema:
          type: string
          format: date
          default: ''
      - name: dateTo
        in: query
        required: false
        description: The date to get results to
        schema:
          type: string
          format: date
          default: ''
      - name: limit
        in: query
        required: false
        description: Limit result set for server-side paging
        schema:
          type: integer
          default: ''
      - name: pageToken
        in: query
        required: false
        description: Offset result set when paging
        schema:
          type: integer
          default: ''
      tags:
      - Accounts
      security:
      - bearer: []
components:
  schemas:
    Transaction:
      type: object
      properties:
        tx_id:
          type: string
          description: Transaction ID (unique code)
        account_id:
          type: integer
          description: Account ID
        value_date:
          type: string
          description: Date of transaction
        credit:
          type: boolean
          description: Is the transaction a credit/deposit.  1 for credit (true), 0 for debit (false)
        details:
          $ref: '#/components/schemas/TransactionDetails'
        ticker:
          type: string
          description: Asset identifier (e.g. 'BTC', 'USD')
        amount:
          type: string
          description: Transaction amount
        approved:
          type: boolean
          description: Flag is 1 if approved
        notes:
          type: string
          description: Free-text notes
        source_name:
          type: string
          description: Transaction source
      required:
      - tx_id
      - account_id
      - value_date
      - credit
      - details
      - ticker
      - approved
      - amount
      - notes
      - source_name
    BalanceResponse:
      type: object
      properties:
        accountId:
          type: number
          description: The id of the account
        settled:
          type: string
          description: The settled balance of the account. This is formatted with a '.' decimal separator and without thousand separators
          example: '1234.12'
        available:
          type: string
          description: The balance available with which to make payments from the account. This is formatted with a '.' decimal separator and without thousand separators
          example: '1234.12'
      required:
      - accountId
      - settled
      - available
    TransactionDetailResponse:
      type: object
      properties:
        tx_id:
          type: string
          description: Transaction ID (unique code)
      required:
      - tx_id
    TransactionDetails:
      type: object
      description: Sender or receiver account information depending on payment direction
      properties:
        bic:
          type: string
        iban:
          type: string
        blinc_id:
          type: string
        reference:
          type: string
        sort_code:
          type: string
        account_name:
          type: string
        account_number:
          type: string
        counterparty_reference:
          type: string
        endToEndIdentifier:
          type: string
        nonce:
          type: number
      required:
      - nonce
      - endToEndIdentifier
      - counterparty_reference
      - account_number
      - account_name
      - reference
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: The description of the error.
        statusCode:
          type: integer
          description: HTTP Status code representing the error.
      required:
      - message
      - statusCode
    Account:
      type: object
      properties:
        id:
          type: integer
          description: Account ID
        counterparty_id:
          type: integer
          description: Counterparty ID
        aid:
          type: string
          description: Alpha-numeric account ID
        cid:
          type: string
          description: Alpha-numeric counterparty ID
        account_type:
          type: string
          enum:
          - Bank
          - Custodial
          - Wallet
          description: ''
        ccy:
          type: string
          description: Asset ticker, or left hand side of trading symbol
        host_name:
          type: string
          description: Bank Name for bank accounts, Custodian Name for custody accounts, Wallet Name for wallet accounts
        host_hub:
          type: string
          description: Branch Code for bank accounts, optional for custody and wallets
        host_location:
          type: string
        node_name:
          type: string
          description: Account holder's legal name
        node_address:
          type: string
          description: Account Number for bank accounts, wallet address for wallets, optional for custody
        node_location:
          type: string
          description: Account holder's residential address for bank accounts, optional memo field for custody and wallets
        node_country:
          type: string
          description: Account holder's residential address country code (2-letter ISO country code), optional memo field for custody and wallets
        iban:
          type: string
          description: IBAN for bank accounts
        account_label:
          type: string
          description: Display name for account
        description:
          type: string
          description: Free-text description of account
        bcb_controlled:
          type: string
          description: Flag is 1 if BCB can operate the account, 0 otherwise
        settlement_reference:
          type: string
          description: Optional settlement reference for payments
        created_at:
          type: string
          description: Timestamp of account record creation (YYYY-MM-DDTHH:MM:SS.000Z)
        updated_at:
          type: string
          description: Timestamp of account record update (YYYY-MM-DDTHH:MM:SS.000Z)
        blinc_id:
          type: string
          description: Only applicable to BLINC accounts - account id within BLINC network
        partner_id:
          type: string
          description: This field is deprecated.
        email:
          type: string
          description: Email address of client
        reporting_ccy:
          type: string
          description: Home currency of client
        pid:
          type: string
          description: This field is deprecated.
        partner_name:
          type: string
          description: This field is deprecated.
      required:
      - id
      - counterparty_id
