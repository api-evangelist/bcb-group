                  - tx_id: 38aa62fa-653e-11e9-b39c-42010a8400a9
                    account_id: 539
                    blinc_id: null
                    network: FPS
                    value_date: '2019-04-22T19:35:37.000Z'
                    credit: 1
                    details:
                      bic: null
                      iban: GB41CLRB04054100000033
                      blinc_id: null
                      reference: BCB Pay 53135 GBP
                      sort_code: '040541'
